<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.s{width:360px;height:740px;box-sizing:border-box;background:#f4f5fb;color:#1a1a2e;position:relative;overflow:hidden;padding:24px 16px}
h1{margin:0;font-size:28px;font-weight:800}
.c{background:#fff;border-radius:18px}
.tb{position:absolute;left:0;right:0;bottom:0;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eceef6}
.tb button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#6b7088;min-width:72px;min-height:44px}
.tb .on{color:#4f46e5}
.r{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eceef6;font-size:14px}
.r:last-child{border:0}.r span{color:#6b7088}.r b{font-weight:700}
.back{background:none;border:0;color:#4f46e5;font-size:13px;padding:0 0 10px;min-height:32px}
.pb{display:block;width:100%;height:50px;border:0;border-radius:14px;background:#4f46e5;color:#fff;font-weight:700;font-size:16px}
.ic{width:44px;height:44px;border:0;border-radius:12px;background:#fdeeee;color:#dc2626;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="s">
<button class="back">‹ Назад</button>
<h1 style="margin-bottom:12px">Урок</h1>
<div class="c" style="padding:4px 16px">
<div class="r"><span>Дата</span><b>19.10.2026</b></div>
<div class="r"><span>Время</span><b>08:30 – 09:15</b></div>
<div class="r"><span>Класс</span><b>5-А</b></div>
<div class="r"><label for="cab" style="color:#6b7088">Кабинет</label><input id="cab" value="411 (1)" style="flex:1;min-width:0;border:0;background:none;outline:0;padding:0;text-align:right;font-size:14px;font-weight:700"></div>
<div class="r" style="display:block"><span style="font-size:12px">Тема</span><div style="font-weight:600;margin-top:2px">PowerPoint основы</div></div></div>
<button class="pb" style="margin-top:16px">Сохранить</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":740}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>

</html>
